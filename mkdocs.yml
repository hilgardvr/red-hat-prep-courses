site_name: RHCSA Field Guide
site_description: A free, lab-first course for the Red Hat Certified System Administrator (EX200) exam on RHEL 10.
site_author: RHCSA Field Guide contributors

# The workflow sets SITE_URL for GitHub Pages. Change the fallback when you
# move to a custom domain, or set the environment variable in your build.
site_url: !ENV [SITE_URL, "https://your-username.github.io/red-hat-certs/"]

# Uncomment these after you create the repository:
# repo_url: https://github.com/your-username/red-hat-certs
# edit_uri: edit/main/docs/

copyright: >
  Unofficial study material. Not affiliated with or endorsed by Red Hat, Inc.
  Red Hat, RHCSA, and RHEL are trademarks of Red Hat, Inc.

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.tracking
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - assets/stylesheets/extra.css

extra:
  generator: false

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Start here:
      - How to use this course: start-here/how-to-use.md
      - Exam overview: start-here/exam-overview.md
      - Study plans: start-here/study-plans.md
      - Lab setup: start-here/lab-setup.md
  - Foundations:
      - Overview: foundations/index.md
      - "F1 — Linux and the RHEL family": foundations/f1-linux-rhel-family/index.md
      - "F2 — The lab and first login": foundations/f2-lab-first-login/index.md
      - "F3 — Shell, commands, and help": foundations/f3-shell-help/index.md
      - "F4 — Filesystem and file operations": foundations/f4-filesystem-operations/index.md
      - "F5 — Streams, pipes, and text": foundations/f5-streams-text/index.md
      - "F6 — Users, permissions, ownership": foundations/f6-users-permissions/index.md
      - "F7 — Processes, systemd, and logs": foundations/f7-processes-systemd/index.md
      - "F8 — Networking, storage, SELinux": foundations/f8-networking-storage-selinux/index.md
  - RHCSA:
      - Course roadmap: rhcsa/index.md
      - "R1 — Essential tools":
          - Theory: rhcsa/r01-essential-tools/index.md
          - "Lab 1 — Files and links": rhcsa/r01-essential-tools/labs/lab-1-files-and-links.md
          - "Lab 2 — Streams and permissions": rhcsa/r01-essential-tools/labs/lab-2-streams-and-permissions.md
          - "Challenge — Handoff bundle": rhcsa/r01-essential-tools/labs/challenge-handoff.md
          - Knowledge check: rhcsa/r01-essential-tools/quiz.md
          - Cheat sheet: rhcsa/r01-essential-tools/cheatsheet.md
      - "R2 — Users and groups":
          - Theory: rhcsa/r02-users-and-groups/index.md
          - "Lab 1 — Accounts and groups": rhcsa/r02-users-and-groups/labs/lab-1-accounts-and-groups.md
          - "Lab 2 — Passwords, policy, and sudo": rhcsa/r02-users-and-groups/labs/lab-2-password-policy-and-sudo.md
          - "Challenge — Onboarding wave 2": rhcsa/r02-users-and-groups/labs/challenge-onboarding.md
          - Knowledge check: rhcsa/r02-users-and-groups/quiz.md
          - Cheat sheet: rhcsa/r02-users-and-groups/cheatsheet.md
      - "R3 — Software and repositories":
          - Theory: rhcsa/r03-software-and-repositories/index.md
          - "Lab 1 — RPM repositories": rhcsa/r03-software-and-repositories/labs/lab-1-rpm-repositories.md
          - "Lab 2 — Flatpak": rhcsa/r03-software-and-repositories/labs/lab-2-flatpak.md
          - "Challenge — The offline build server": rhcsa/r03-software-and-repositories/labs/challenge-offline-build.md
          - Knowledge check: rhcsa/r03-software-and-repositories/quiz.md
          - Cheat sheet: rhcsa/r03-software-and-repositories/cheatsheet.md
  - Reference:
      - Glossary: reference/glossary.md
      - Objective coverage: reference/objective-coverage.md
      - RHEL 9 vs RHEL 10: reference/rhel9-vs-rhel10.md
